<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Con inteligencIA — Plataforma Ética de Verificación</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg: #ffffff;
      --surface: #f4f7fb;
      --surface-2: #eef3f9;
      --ink: #0f172a;
      --muted: #475569;
      --line: #cbd5e1;
      --blue: #0b5cab;
      --blue-dark: #08427a;
      --teal: #0ea5a4;
      --real: #15803d;
      --real-bg: #dcfce7;
      --fake: #b91c1c;
      --fake-bg: #fee2e2;
      --warn: #b45309;
      --warn-bg: #fef3c7;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      margin: 0;
      background: var(--surface);
      color: var(--ink);
      line-height: 1.5;
    }

    .app-frame {
      max-width: 560px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--bg);
      box-shadow: 0 0 0 1px #e2e8f0;
      position: relative;
      padding-bottom: 3rem;
    }

    /* Encabezado superior */
    .header-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #e2e8f0;
      padding: 0.7rem 0.9rem;
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .menu-trigger {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1.5px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .menu-trigger:hover {
      background: var(--surface);
      border-color: var(--blue);
    }

    .search-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      padding: 0.4rem 0.85rem;
      background: var(--surface);
    }

    .search-wrap input {
      border: none;
      background: transparent;
      width: 100%;
      font-size: 0.9rem;
      color: var(--ink);
      outline: none;
    }

    .home-badge-btn {
      border: 1.5px solid #bae6fd;
      background: #f0f9ff;
      color: var(--blue-dark);
      border-radius: 999px;
      padding: 0.38rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* Menú desplegable */
    .nav-menu {
      display: none;
      position: fixed;
      top: 56px;
      left: 12px;
      z-index: 60;
      width: 248px;
      background: var(--bg);
      border: 1.5px solid var(--line);
      border-radius: 14px;
      box-shadow: 0 16px 34px rgba(15, 23, 42, 0.16);
      padding: 0.35rem;
      flex-direction: column;
      gap: 0.2rem;
    }

    .nav-menu.open {
      display: flex;
    }

    .nav-menu button {
      width: 100%;
      border: none;
      background: transparent;
      color: var(--ink);
      text-align: left;
      padding: 0.72rem 0.85rem;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-menu button:hover,
    .nav-menu button.active {
      background: #eff6ff;
      color: var(--blue);
    }

    .section-view {
      display: none;
      padding: 1.15rem 1.1rem 0;
      animation: fadeSlide 0.18s ease;
    }

    .section-view.active {
      display: block;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Portada principal */
    .brand-header {
      text-align: center;
      padding-top: 0.35rem;
    }

    .lens-graphic {
      position: relative;
      width: 162px;
      height: 146px;
      margin: 0 auto 0.65rem;
    }

    .lens-circle {
      width: 124px;
      height: 124px;
      border-radius: 50%;
      border: 6px solid #0284c7;
      background: #f0f9ff;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.22rem;
      box-shadow: inset 0 0 0 3px #bae6fd;
    }

    .lens-char {
      font-size: 2.2rem;
      font-weight: 800;
      color: #0f2942;
      line-height: 1;
    }

    .lens-cog {
      font-size: 1.55rem;
      color: #0369a1;
      line-height: 1;
    }

    .lens-stem {
      position: absolute;
      width: 48px;
      height: 14px;
      background: #0f3b66;
      border-radius: 999px;
      right: 8px;
      bottom: 12px;
      transform: rotate(42deg);
    }

    .brand-title-wrap {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      margin-bottom: 0.5rem;
    }

    .brand-title-wrap h1 {
      margin: 0;
      font-size: 1.9rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }

    .ia-orb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 2px solid #0284c7;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 0.82rem;
      font-weight: 900;
      display: inline-grid;
      place-items: center;
    }

    .brand-desc {
      margin: 0 auto 1.15rem;
      max-width: 380px;
      font-size: 0.95rem;
      color: #334155;
    }

    /* Zona de subida */
    .upload-box {
      border: 2px dashed #7dd3fc;
      border-radius: 18px;
      padding: 0.9rem;
      background: #f8fcff;
    }

    .main-upload-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 0.95rem 1.15rem;
      background: linear-gradient(90deg, var(--blue), var(--teal));
      color: #ffffff;
      font-size: 1.08rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.7rem;
      box-shadow: 0 6px 16px rgba(11, 92, 171, 0.2);
    }

    .sub-upload-btn {
      width: 100%;
      margin-top: 0.6rem;
      border: 1px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      border-radius: 10px;
      padding: 0.58rem 0.75rem;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
    }

    .sub-upload-btn:hover {
      border-color: var(--blue);
    }

    .status-banner {
      margin-top: 0.7rem;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--blue);
    }

    #main-img-preview,
    #main-vid-preview {
      display: none;
      max-width: 100%;
      max-height: 245px;
      margin: 0.75rem auto 0;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    /* Resultado + Reporte descargable */
    .result-panel {
      display: none;
      margin-top: 1rem;
      padding: 1rem;
      border-radius: var(--radius);
      border: 1.5px solid var(--line);
      background: var(--surface);
    }

    .verdict-chip {
      display: inline-block;
      padding: 0.26rem 0.75rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 800;
      margin-bottom: 0.35rem;
    }

    .chip-real {
      background: var(--real-bg);
      color: var(--real);
    }

    .chip-fake {
      background: var(--fake-bg);
      color: var(--fake);
    }

    .chip-warn {
      background: var(--warn-bg);
      color: var(--warn);
    }

    .meter-rail {
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
      margin: 0.55rem 0 0.75rem;
    }

    .meter-bar {
      height: 100%;
      width: 0%;
      transition: width 0.35s ease;
    }

    .findings-list {
      margin: 0;
      padding-left: 1.15rem;
      font-size: 0.9rem;
    }

    .findings-list li {
      margin-bottom: 0.3rem;
    }

    .report-bar {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.85rem;
      flex-wrap: wrap;
    }

    .btn-download {
      flex: 1;
      min-width: 150px;
      border: none;
      border-radius: 10px;
      padding: 0.62rem 0.85rem;
      background: var(--blue);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-toggle-txt {
      flex: 1;
      min-width: 140px;
      border: 1.5px solid var(--line);
      background: var(--bg);
      color: var(--ink);
      border-radius: 10px;
      padding: 0.6rem 0.8
